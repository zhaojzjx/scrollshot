<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" width="1160" height="480" role="img">
  <title>ScrollShot 工作流程</title>
  <desc>三段式流程：采集、拼接、输出</desc>

  <rect width="1160" height="480" fill="#ffffff"/>

  <text x="40" y="44" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#0C447C">ScrollShot 工作流程</text>

  <text x="40" y="90" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#5F5E5A">① 采集</text>
  <text x="415" y="90" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#5F5E5A">② 拼接</text>
  <text x="790" y="90" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#5F5E5A">③ 输出</text>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="40" y="110" width="330" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="60" y="136" font-size="15" font-weight="600" fill="#0C447C">框选遮罩</text>
    <text x="60" y="156" font-size="13" fill="#185FA5">拖拽选区，松开鼠标即开始采集</text>

    <rect x="40" y="184" width="330" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="60" y="210" font-size="15" font-weight="600" fill="#0C447C">滚回顶部</text>
    <text x="60" y="230" font-size="13" fill="#185FA5">Ctrl+Home 定位起点</text>

    <rect x="40" y="258" width="330" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="60" y="284" font-size="15" font-weight="600" fill="#0C447C">滚动 + 判稳</text>
    <text x="60" y="304" font-size="13" fill="#185FA5">连续 3 帧差异 &lt; 0.2% 才采样</text>

    <rect x="40" y="332" width="330" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="60" y="358" font-size="15" font-weight="600" fill="#0C447C">逐帧比对</text>
    <text x="60" y="378" font-size="13" fill="#185FA5">行签名 SAD 求内容上移行数 s</text>

    <rect x="415" y="110" width="330" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="435" y="136" font-size="15" font-weight="600" fill="#26215C">底边对齐入卷</text>
    <text x="435" y="156" font-size="13" fill="#534AB7">新帧底边 = 上帧底边 + s</text>

    <rect x="415" y="184" width="330" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="435" y="210" font-size="15" font-weight="600" fill="#26215C">触顶检查</text>
    <text x="435" y="230" font-size="13" fill="#534AB7">累计高度达到单张上限？</text>

    <rect x="415" y="258" width="330" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="435" y="284" font-size="15" font-weight="600" fill="#26215C">切点搜索</text>
    <text x="435" y="304" font-size="13" fill="#534AB7">目标高度附近找方差最低的行</text>

    <rect x="415" y="332" width="330" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="435" y="358" font-size="15" font-weight="600" fill="#26215C">封板写出</text>
    <text x="435" y="378" font-size="13" fill="#534AB7">尾部 100px 作为下一卷开头</text>

    <rect x="790" y="110" width="330" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="810" y="136" font-size="15" font-weight="600" fill="#04342C">编码保存</text>
    <text x="810" y="156" font-size="13" fill="#0F6E56">PNG / JPG，仅写图片不建索引</text>

    <rect x="790" y="184" width="330" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="810" y="210" font-size="15" font-weight="600" fill="#04342C">预览与复制</text>
    <text x="810" y="230" font-size="13" fill="#0F6E56">多卷导航、缩放、剪贴板</text>
  </g>

  <g stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="375" y1="139" x2="411" y2="139"/>
    <line x1="750" y1="139" x2="786" y2="139"/>
    <line x1="205" y1="168" x2="205" y2="180"/>
    <line x1="205" y1="242" x2="205" y2="254"/>
    <line x1="205" y1="316" x2="205" y2="328"/>
    <line x1="580" y1="168" x2="580" y2="180"/>
    <line x1="580" y1="242" x2="580" y2="254"/>
    <line x1="580" y1="316" x2="580" y2="328"/>
    <line x1="955" y1="168" x2="955" y2="180"/>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M580 390 L580 408 L205 408 L205 394" stroke="#888780" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="40" y="440" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5F5E5A">虚线回路：采集与拼接交替进行，直到连续两帧整帧无变化（到底）或触达卷数 / 总高度阈值</text>
  <text x="40" y="462" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5F5E5A">任一卷封板即立刻落盘，内存中同一时刻只保留当前卷，因此长页面也不会撑爆内存</text>
</svg>
